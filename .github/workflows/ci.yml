name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; only the deploy job is granted write access to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  e2e:
    # The unit suite runs under jsdom, which has neither a Web Worker nor a
    # canvas. This job is the only place the worker, Chart.js and the image
    # exporter are exercised for real, so deploy waits on it too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers
        # WebKit stands in for Safari on iOS, where oversized canvases come back
        # blank without an error — the failure the export tests exist to catch.
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Assemble deploy folder (site assets only — no tests, fixtures, or dev config)
        run: |
          mkdir dist
          cp index.html dashboard.html manifest.json favicon.svg sw.js dist/
          cp -r css js fonts icons dist/
      - name: Version the service worker cache
        # One cache name per release, so every deploy drops the previous shell
        # instead of relying on someone remembering to bump it by hand.
        run: sed -i "s/const CACHE_NAME = 'ww-shell-dev'/const CACHE_NAME = 'ww-shell-${GITHUB_SHA::12}'/" dist/sw.js && grep -q "ww-shell-${GITHUB_SHA::12}" dist/sw.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
