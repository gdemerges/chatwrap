name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # The unit suite runs under jsdom, which has neither a Web Worker nor a
    # canvas. This job is the only place the worker, Chart.js and the image
    # exporter are exercised for real, so deploy waits on it too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers
        # WebKit stands in for Safari on iOS, where oversized canvases come back
        # blank without an error — the failure the export tests exist to catch.
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble deploy folder (site assets only — no tests, fixtures, or dev config)
        run: |
          mkdir dist
          cp index.html dashboard.html manifest.json favicon.svg sw.js dist/
          cp -r css js fonts icons dist/
      - name: Version the service worker cache
        # One cache name per release, so every deploy drops the previous shell
        # instead of relying on someone remembering to bump it by hand.
        run: sed -i "s/const CACHE_NAME = 'ww-shell-dev'/const CACHE_NAME = 'ww-shell-${GITHUB_SHA::12}'/" dist/sw.js && grep -q "ww-shell-${GITHUB_SHA::12}" dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
